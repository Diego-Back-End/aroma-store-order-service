# Server Configuration
server.port=8083

# Database Configuration
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:3306/db_pedidos
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# RabbitMQ Configuration
#spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:rabbitmq}
#spring.rabbitmq.port=5672
#spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:guest}
#spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:guest}

# Application Configuration
spring.application.name=aroma-store-order-service

# User Service Configuration
user.service.url=${USER_SERVICE_URL:http://aroma-backend-alb-1937240674.us-east-1.elb.amazonaws.com}

# CORS Configuration
spring.web.cors.allowed-origins=http://aroma-frontend-alb-1885672236.us-east-1.elb.amazonaws.com
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*

# HikariCP Configuration
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

spring.rabbitmq.enabled=false